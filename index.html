<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>STARSEED STATION</title>
<link rel="stylesheet" href="css/shared.css?v=2026-10-24d">
<style>
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg-void);
    display: flex;
    align-items: center;
    justify-content: center;
    height: 100vh;
    overflow: hidden;   /* the stage is scaled to fit, never scrolled */
  }
  /* Fit-to-window: the 1280×720 stage scales (up or down) by --fs-scale, set
     by fitStageToWindow() below. Everything (tooltips, overlays, drag math)
     already reads --fs-scale, so the whole game follows the transform. */
  #stage {
    background: var(--bg-base);
    flex-shrink: 0;
    transform: scale(var(--fs-scale, 1));
    transform-origin: center center;
  }
</style>
</head>
<body>

<div id="stage">
  <div id="top-bar"></div>
  <div id="game-panel">
    <div id="hub-layer"></div>
  </div>
  <div id="tray"></div>
</div>

<script src="js/shared.js?v=2026-10-24d"></script>
<script>
/* ============================================================================
   STARSEED STATION — the game (Demo 15: full integration).
   Everything lives in shared.js/shared.css; this page is pure orchestration:
   game mode on → startup screen → hub → the run plays itself through the
   registered room builders. No Devtools sidebar here — demos keep theirs.
   ============================================================================ */

enableGameMode();   // autosave-at-hub + global run-over triggers

/* Fit the 1280×720 stage to the window: fill the full width on wide screens,
   shrink on small ones. Contain-fit (min of the two ratios) so a short window
   never clips the tray. */
function fitStageToWindow() {
  const s = Math.min(window.innerWidth / 1280, window.innerHeight / 720);
  document.documentElement.style.setProperty('--fs-scale', s.toFixed(4));
}
window.addEventListener('resize', fitStageToWindow);
fitStageToWindow();

/* ▶ New Run on the final run-summary modal = restart to the very beginning:
   back to the title card, where the player picks a difficulty again. */
setNewRunHandler(() => {
  resetStageToHub();
  mountStartupScreen({ onStart: enterStation });
});

/* After the startup screen fades: the hub is already rendered underneath.
   On a resumed run that actually ended (saved at the final modal, reloaded
   later), reopen the summary — the run is over; New Run is the way forward.
   Otherwise raise the hub welcome tour (first visit per run — no-op if seen). */
function enterStation(mode) {
  if (mode === 'continue' && gameState.tray.some(Boolean) && harvRunOver()) {
    openRunSummary();
    return;
  }
  maybeShowTour('hub');
}

/* Boot: lock the hub down to the pre-run state so nothing flashes unlocked
   behind the title card, render all surfaces, then raise the startup screen. */
resetHubRooms(gameState, { clearTray: true });
applyDifficulty(loadPrefs().difficulty || 'commander');
refreshAllSurfaces();
mountStartupScreen({ onStart: enterStation });
</script>

</body>
</html>
